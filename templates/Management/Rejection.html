<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Rejection</title>
    <style>
        @page {
             size: 7in 9.25in;
             margin: 27mm 16mm 27mm 16mm;
             color: #f4f1ea;
          }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: rgb(110, 224, 180);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }
        .header {
            background-color: #0074D9;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .content {
            margin-top: 20px;
            text-align: center;
        }
        h1 {
            color: #0074D9;
            font-size: 28px;
            margin-bottom: 20px;
        }
        p {
            line-height: 1.6;
            color: #333;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #0074D9;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .appointment-details {
            background-color: #1ecef5;
            padding: 20px;
            margin-top: 30px;
            border-radius: 5px;
        }
        .appointment-details h2 {
            color: #0c0c0c;
            font-size: 20px;
            margin-top: 0;
        }
        .appointment-details p {
            color: #555;
            font-size: 16px;
        }
        .logo {
            text-align: center;
            margin-top: 20px;
        }
        .logo img {
            width: 100px;
            height: auto;
        }
        .tagline {
            color: #d90000;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- <h1>Appointment Confirmation</h1> -->
            <img  src="https://cdn.dribbble.com/userupload/4295917/file/original-ec80f02f7532b5f8afd04431e4a36cd5.jpg?resize=1200x1200" width="550"  height="100" alt="Hospital Logo"">
        </div>
        <div class="content">
            <p>Dear {{Firstname}},</p>
            <p>Your appointment with {{Doctor}} has been cancelled</p>
            <!-- <div class="appointment-details">
                <h2>Date and Time:</h2>
                <p> {{Time}}</p>
                <h2>Location:</h2>
                <strong>KIET</strong>
            </div> -->
            <p>We are Sorry to inform you that your appointment has been rejected. If you have any questions , please contact us at 101.</p>
            <p>We look forward to providing you with the best possible care.</p>
          
            <div class="logo">
                <img src="https://cdn.dribbble.com/userupload/4295917/file/original-ec80f02f7532b5f8afd04431e4a36cd5.jpg?resize=1200x1200" alt="Hospital Logo">
            </div>
            <p class="tagline">Your Health, Our Priority</p>
        </div>
    </div>
</body>
</html>
